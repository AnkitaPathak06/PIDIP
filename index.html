const DEFAULT_RULES = {
  near_expiry_threshold_days: 30, critical_expiry_threshold_days: 7, safety_stock_buffer_pct: 20,
  inventory_health_threshold_pct: 90, reorder_point_buffer_pct: 10, emergency_supplier_lead_time_days: 5,
  default_procurement_qty_multiplier: 2, reliability_weight_pct: 40, quality_weight_pct: 30,
  unit_price_weight_pct: 20, lead_time_weight_pct: 10, forecast_window_days: 90
};
const CRITICALITY_BONUS = { HIGH: 15, MEDIUM: 7, LOW: 0 };
const DAY_MS = 24 * 60 * 60 * 1000;

function classifyInventory(row, rules) {
  let status = "Healthy";
  if (row.current_stock <= row.safety_stock) status = "Critical";
  else if (row.current_stock <= row.reorder_point) status = "Low";
  const stockoutRisk = row.current_stock <= row.reorder_point;
  let daysToExpiry = null, expiryStatus = "OK";
  if (row.expiry_date) {
    daysToExpiry = Math.round((new Date(row.expiry_date) - new Date()) / DAY_MS);
    if (daysToExpiry <= rules.critical_expiry_threshold_days) expiryStatus = "Critical";
    else if (daysToExpiry <= rules.near_expiry_threshold_days) expiryStatus = "Warning";
  }
  return { ...row, status, stockoutRisk, daysToExpiry, expiryStatus };
}

function normalize(value, min, max, invert) {
  if (max === min) return 1;
  const n = (value - min) / (max - min);
  return invert ? 1 - n : n;
}

function scoreSuppliers(materialId, suppliersAll, rules) {
  const suppliers = suppliersAll.filter((s) => s.material_id === materialId);
  if (suppliers.length === 0) return [];
  const prices = suppliers.map((s) => s.unit_price), leads = suppliers.map((s) => s.lead_time_days);
  const priceMin = Math.min(...prices), priceMax = Math.max(...prices);
  const leadMin = Math.min(...leads), leadMax = Math.max(...leads);
  const wR = rules.reliability_weight_pct / 100, wQ = rules.quality_weight_pct / 100;
  const wP = rules.unit_price_weight_pct / 100, wL = rules.lead_time_weight_pct / 100;
  const scored = suppliers.map((s) => {
    const priceScore = normalize(s.unit_price, priceMin, priceMax, true);
    const leadScore = normalize(s.lead_time_days, leadMin, leadMax, true);
    const composite = wR * (s.reliability_score / 100) + wQ * (s.quality_score / 100) + wP * priceScore + wL * leadScore;
    return { ...s, compositeScore: Math.round(composite * 1000) / 10 };
  });
  scored.sort((a, b) => b.compositeScore - a.compositeScore);
  return scored;
}

function supplierRecommendation(materialId, suppliersAll, rules) {
  const ranked = scoreSuppliers(materialId, suppliersAll, rules);
  if (ranked.length === 0) return { primary: null, emergency: null };
  const available = ranked.filter((s) => s.availability === "Available");
  const primary = available[0] || ranked[0];
  const rest = ranked.filter((s) => s.supplier_id !== primary.supplier_id);
  const emergency = rest.find((s) => s.availability === "Available") || rest[0] || null;
  return { primary, emergency };
}

function materialForecast(materialId, consumptionAll, inventoryEnrichedById) {
  const history = consumptionAll.filter((c) => c.Material_ID === materialId).sort((a, b) => (a.date < b.date ? -1 : 1));
  const inv = inventoryEnrichedById[materialId];
  if (history.length === 0 || !inv) return { hasData: false, history: [], inventory: inv || null };
  const totalQty = history.reduce((s, r) => s + r.qty, 0);
  const firstDate = new Date(history[0].date), lastDate = new Date(history[history.length - 1].date);
  const observedDays = Math.max(1, Math.round((lastDate - firstDate) / DAY_MS) + 1);
  const avgDaily = totalQty / observedDays;
  const mean = avgDaily;
  const variance = history.reduce((s, r) => s + Math.pow(r.qty - mean, 2), 0) / history.length;
  const cv = mean > 0 ? Math.sqrt(variance) / mean : 1;
  let confidence = "Low";
  if (history.length >= 14 && cv < 0.15) confidence = "High";
  else if (history.length >= 7 && cv < 0.35) confidence = "Medium";
  const currentStock = inv.current_stock;
  const daysRemaining = avgDaily > 0 ? currentStock / avgDaily : Infinity;
  const today = new Date();
  const predictedStockoutDate = avgDaily > 0 ? new Date(today.getTime() + daysRemaining * DAY_MS) : null;
  return {
    hasData: true, avgDailyConsumption: Math.round(avgDaily * 100) / 100, observedWindowDays: observedDays,
    forecastConfidence: confidence, daysOfInventoryRemaining: daysRemaining === Infinity ? null : Math.round(daysRemaining * 10) / 10,
    predictedStockoutDate: predictedStockoutDate ? predictedStockoutDate.toISOString().slice(0, 10) : null,
    predictedConsumption: {
      next30: Math.round(avgDaily * 30 * 100) / 100, next60: Math.round(avgDaily * 60 * 100) / 100, next90: Math.round(avgDaily * 90 * 100) / 100
    },
    currentStock, reorderPoint: inv.reorder_point, safetyStock: inv.safety_stock, history
  };
}

function useComputed(rules, inventoryOverrides, purchaseOrders) {
  return useMemo(() => {
    const materials = RAW["Materials"].map((m) => ({
      material_id: m["Material ID"], material_name: m["Material Name"], category: m["Category"],
      unit: m["Unit"], shelf_life_days: m["Shelf Life (Days)"], criticality: m["Criticality"]
    }));
    const materialsById = Object.fromEntries(materials.map((m) => [m.material_id, m]));
    const inventoryRaw = RAW["Inventory"].map((r, i) => {
      const id = i + 1;
      const override = inventoryOverrides[id] || {};
      return {
        id, material_id: r["Material ID"],
        current_stock: override.current_stock ?? r["Current Stock"],
        safety_stock: override.safety_stock ?? r["Safety Stock"],
        reorder_point: override.reorder_point ?? r["Reorder Point"],
        batch_number: r["Batch Number"], mfg_date: r["Manufacturing Date"], expiry_date: r["Expiry Date"]
      };
    });
    const suppliersRaw = RAW["Supplier Catalog"].map((s, i) => ({
      id: i + 1, supplier_id: s["Supplier ID"], supplier_name: s["Supplier Name"], material_id: s["Material ID"],
      unit_price: s["Unit Price (INR)"], lead_time_days: s["Lead Time (Days)"], moq: s["MOQ"],
      quality_score: s["Quality Score"], reliability_score: s["Reliability Score"], availability: s["Availability"]
    }));
    const consumptionRaw = RAW["Consumption History"].map((c) => ({ date: c["Date"], Material_ID: c["Material ID"], qty: c["Quantity Consumed"] }));
    const products = RAW["Products"].map((p) => ({ product_id: p["Product ID"], product_name: p["Product Name"], category: p["Category"], dosage_form: p["Dosage Form"] }));

    const enrichedInventory = inventoryRaw.map((r) => classifyInventory({ ...r, ...materialsById[r.material_id] }, rules)).sort((a, b) => a.material_name.localeCompare(b.material_name));
    const inventoryEnrichedById = Object.fromEntries(enrichedInventory.map((r) => [r.material_id, r]));

    const needsProcurement = enrichedInventory.filter((r) => r.stockoutRisk);
    const recommendations = needsProcurement.map((item) => {
      const { primary, emergency } = supplierRecommendation(item.material_id, suppliersRaw, rules);
      const forecast = materialForecast(item.material_id, consumptionRaw, inventoryEnrichedById);
      let recQty = Math.max(0, Math.round((item.safety_stock * rules.default_procurement_qty_multiplier - item.current_stock) * 100) / 100);
      if (primary && primary.moq && recQty < primary.moq) recQty = primary.moq;
      const shortfallRatio = item.reorder_point > 0 ? Math.max(0, (item.reorder_point - item.current_stock) / item.reorder_point) : 0;
      const priorityScore = Math.round((shortfallRatio * 100 + (CRITICALITY_BONUS[item.criticality] || 0)) * 10) / 10;
      let reason = "Below reorder point";
      if (item.status === "Critical") reason = "Below safety stock";
      else if (primary && primary.reliability_score >= 95) reason = "Highest reliability";
      return {
        materialId: item.material_id, materialName: item.material_name, unit: item.unit, criticality: item.criticality,
        currentStock: item.current_stock, safetyStock: item.safety_stock, reorderPoint: item.reorder_point,
        recommendedQty: recQty, priorityScore, isHighPriority: priorityScore >= 50, reason,
        primarySupplier: primary ? { name: primary.supplier_name, leadTimeDays: primary.lead_time_days, moq: primary.moq, unitPrice: primary.unit_price } : null,
        emergencySupplier: emergency ? { name: emergency.supplier_name, leadTimeDays: emergency.lead_time_days, moq: emergency.moq, unitPrice: emergency.unit_price } : null,
        estimatedCost: primary ? Math.round(primary.unit_price * recQty * 100) / 100 : null,
        predictedStockoutDate: forecast.hasData ? forecast.predictedStockoutDate : null
      };
    }).sort((a, b) => b.priorityScore - a.priorityScore);

    const nearExpiry = enrichedInventory.filter((r) => r.expiryStatus !== "OK");
    const healthyCount = enrichedInventory.filter((r) => r.status !== "Critical").length;
    const inventoryHealthPct = Math.round((healthyCount / enrichedInventory.length) * 1000) / 10;

    const uniqueSupplierNames = [...new Set(suppliersRaw.map((s) => s.supplier_name))];
    let highestReliability = null, fastestLeadTime = null, lowestMoq = null;
    const flaggedNames = new Set();
    for (const s of suppliersRaw) {
      if (!highestReliability || s.reliability_score > highestReliability.reliability_score) highestReliability = s;
      if (!fastestLeadTime || s.lead_time_days < fastestLeadTime.lead_time_days) fastestLeadTime = s;
      if (!lowestMoq || s.moq < lowestMoq.moq) lowestMoq = s;
      if (s.reliability_score < 80 || s.lead_time_days > 10 || s.availability !== "Available") flaggedNames.add(s.supplier_name);
    }
    let materialsWithBackup = 0;
    for (const m of materials) { const { emergency } = supplierRecommendation(m.material_id, suppliersRaw, rules); if (emergency) materialsWithBackup += 1; }

    const priceByMaterial = {};
    for (const s of suppliersRaw) { if (!(s.material_id in priceByMaterial) || s.unit_price < priceByMaterial[s.material_id]) priceByMaterial[s.material_id] = s.unit_price; }
    const totalInventoryValue = enrichedInventory.reduce((sum, r) => sum + r.current_stock * (priceByMaterial[r.material_id] || 0), 0);
    const consumptionValue = consumptionRaw.reduce((sum, c) => sum + c.qty * (priceByMaterial[c.Material_ID] || 0), 0);
    const inventoryTurnover = totalInventoryValue > 0 ? Math.round((consumptionValue / totalInventoryValue) * 100) / 100 : 0;
    const estimatedSpend = recommendations.reduce((s, r) => s + (r.estimatedCost || 0), 0);

    return {
      materials, products, inventoryRaw, suppliersRaw, consumptionRaw, enrichedInventory, inventoryEnrichedById,
      recommendations, nearExpiry, inventoryHealthPct,
      supplierInsights: { totalSuppliers: uniqueSupplierNames.length, highestReliability, fastestLeadTime, lowestMoq, flaggedCount: flaggedNames.size, emergencyCoverage: { covered: materialsWithBackup, total: materials.length } },
      quickKpis: { totalProducts: products.length, totalMaterials: materials.length, activeSuppliers: uniqueSupplierNames.length, openPurchaseOrders: purchaseOrders.filter((po) => po.status === "Pending").length, inventoryTurnover },
      totalInventoryValue: Math.round(totalInventoryValue * 100) / 100, estimatedSpend: Math.round(estimatedSpend * 100) / 100,
      highPriorityCount: recommendations.filter((r) => r.isHighPriority).length, highestPriorityMaterial: recommendations[0] || null,
      earliestStockout: recommendations.filter((r) => r.predictedStockoutDate).sort((a, b) => (a.predictedStockoutDate < b.predictedStockoutDate ? -1 : 1))[0] || null
    };
  }, [rules, inventoryOverrides, purchaseOrders]);
}

const inr = (n) => (n == null ? "—" : `₹${Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 })}`);
const STATUS_COLOR = { Healthy: "#3d7a5c", Low: "#b9762b", Critical: "#a63a2e", OK: "#3d7a5c", Warning: "#b9762b", Available: "#3d7a5c", Unavailable: "#a63a2e", Pending: "#b9762b", Approved: "#3d7a5c" };

function Dot({ label }) {

  return <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12.5 }}><span style={{ width: 7, height: 7, borderRadius: 999, background: c, display: "inline-block" }} />{label}</span>;

}

function Panel({ children, style }) { return <div style={{ border: "1px solid var(--line)", background: "#fff", ...style }}>{children}</div>; }
function SectionHead({ title, hint }) {
  return <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 12, flexWrap: "wrap", gap: 6 }}>

    {hint && <span style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>{hint}</span>}

}

  if (kind === "critical") return { boxShadow: "inset 3px 0 0 #a63a2e" };
  if (kind === "warning") return { boxShadow: "inset 3px 0 0 #b9762b" };
  if (kind === "healthy") return { boxShadow: "inset 3px 0 0 #3d7a5c" };
  return {};
}

/* Small hand-rolled SVG line chart — no external chart library needed */
function TrendChart({ data }) {
  const w = 640, h = 220, padL = 34, padB = 24, padT = 10, padR = 10;
  if (!data || data.length === 0) return null;
  const values = data.map((d) => d.qty);
  const min = Math.min(...values, 0), max = Math.max(...values);
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const x = (i) => padL + (i / Math.max(1, data.length - 1)) * innerW;
  const y = (v) => padT + innerH - ((v - min) / Math.max(1e-6, max - min)) * innerH;
  const path = data.map((d, i) => `${i === 0 ? "M" : "L"} ${x(i).toFixed(1)} ${y(d.qty).toFixed(1)}`).join(" ");
  const step = Math.max(1, Math.floor(data.length / 8));
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" style={{ display: "block" }}>
      {[0, 0.25, 0.5, 0.75, 1].map((f) => (
        <line key={f} x1={padL} x2={w - padR} y1={padT + innerH * f} y2={padT + innerH * f} stroke="#e9ede9" strokeWidth="1" />
      ))}
      <path d={path} fill="none" stroke="#0f7f82" strokeWidth="2" />
      {data.map((d, i) => (i % step === 0 ? <text key={i} x={x(i)} y={h - 6} fontSize="10" fill="#5a6b70" textAnchor="middle">{d.date}</text> : null))}
      <text x={padL - 6} y={y(max) + 4} fontSize="10" fill="#5a6b70" textAnchor="end">{Math.round(max)}</text>
      <text x={padL - 6} y={y(min) + 4} fontSize="10" fill="#5a6b70" textAnchor="end">{Math.round(min)}</text>
    </svg>
  );
}

          </div>
        </div>
        <div style={{ overflowX: "auto" }}><table><thead><tr><th style={th}>Supplier</th><th style={th}>Material</th><th style={{ ...th, textAlign: "right" }}>Unit price</th><th style={{ ...th, textAlign: "right" }}>Lead time</th><th style={{ ...th, textAlign: "right" }}>MOQ</th><th style={{ ...th, textAlign: "right" }}>Quality</th><th style={{ ...th, textAlign: "right" }}>Reliability</th><th style={th}>Availability</th></tr></thead>
          <tbody>{pageRows.map((s) => (
            <tr key={s.id}><td style={td}>{s.supplier_name}</td><td style={td}>{s.material_name}</td><td style={tdNum}>₹{s.unit_price}</td><td style={tdNum}>{s.lead_time_days}d</td>
              <td style={tdNum}>{s.moq}</td><td style={tdNum}>{s.quality_score}</td><td style={tdNum}>{s.reliability_score}</td><td style={td}><Dot label={s.availability} /></td>
            </tr>))}</tbody></table></div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 16px", borderTop: "1px solid var(--line)", flexWrap: "wrap", gap: 8 }}>
          <span style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>{rows.length} records</span>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <button disabled={page <= 1} onClick={() => setPage((p) => p - 1)} style={btnSecondary(page <= 1)}>Previous</button>
            <span style={{ fontFamily: "var(--font-mono)", fontSize: 12.5 }}>Page {page} of {totalPages}</span>
            <button disabled={page >= totalPages} onClick={() => setPage((p) => p + 1)} style={btnSecondary(page >= totalPages)}>Next</button>
          </div>
        </div>
      </Panel>
    </div>
  );
}

function ForecastingPage({ data }) {
  const [materialId, setMaterialId] = useState(data.materials[0]?.material_id);
  const forecast = useMemo(() => materialForecast(materialId, data.consumptionRaw, data.inventoryEnrichedById), [materialId, data]);
  const material = data.materials.find((m) => m.material_id === materialId);
  const chartData = (forecast.history || []).map((h) => ({ date: h.date.slice(5), qty: h.qty }));
  return (
    <div>
      <div style={{ marginBottom: 24 }}><h1 style={{ fontSize: 26, marginBottom: 6, fontFamily: "var(--font-display)" }}>Demand Forecasting</h1>
        <p style={{ color: "var(--ink-soft)", fontSize: 14, maxWidth: 640, margin: 0 }}>Material-level consumption trend, moving-average projection and stockout risk.</p></div>
      <div style={{ maxWidth: 340, marginBottom: 24 }}>
        <label style={{ fontSize: 12.5, color: "var(--ink-soft)", display: "block", marginBottom: 5 }}>Material</label>
        <select value={materialId} onChange={(e) => setMaterialId(e.target.value)} style={{ ...inputStyle, width: "100%" }}>
          {data.materials.map((m) => <option key={m.material_id} value={m.material_id}>{m.material_name} ({m.material_id})</option>)}
        </select>
      </div>
      {!forecast.hasData ? <div style={{ padding: 30, textAlign: "center", color: "var(--ink-soft)" }}>No consumption history recorded for this material.</div> : (
        <>
          {forecast.currentStock <= forecast.reorderPoint && (
            <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 16px", background: "#faf1e3", border: "1px solid #ecd5ab", color: "#7a5119", fontSize: 13, marginBottom: 20 }}>
              <strong>Procurement action recommended.</strong> {material?.material_name} is at or below its reorder point ({forecast.reorderPoint}).
            </div>
          )}
          <KpiStrip>
            <Kpi label="Average daily consumption" value={`${forecast.avgDailyConsumption} ${material?.unit}/day`} />
            <Kpi label="Days of inventory remaining" value={forecast.daysOfInventoryRemaining ?? "—"} color="#b9762b" />
            <Kpi label="Predicted stockout date" value={forecast.predictedStockoutDate || "—"} color="#a63a2e" />
            <Kpi label="Forecast confidence" value={forecast.forecastConfidence} />
          </KpiStrip>
          <div className="grid2">
            <div>
              <SectionHead title="Historical consumption trend" hint={`${forecast.observedWindowDays} days observed`} />
              <Panel style={{ padding: "16px" }}><TrendChart data={chartData} /></Panel>
            </div>
            <div>
              <SectionHead title="Predicted consumption" />
              <Panel><div style={{ padding: "14px 16px" }}>
                {[["Next 30 days", `${forecast.predictedConsumption.next30} ${material?.unit}`], ["Next 60 days", `${forecast.predictedConsumption.next60} ${material?.unit}`],
                  ["Next 90 days", `${forecast.predictedConsumption.next90} ${material?.unit}`], ["Current stock", `${forecast.currentStock} ${material?.unit}`],
                  ["Reorder point", forecast.reorderPoint], ["Safety stock", forecast.safetyStock]
                ].map(([label, val]) => (
                  <div key={label} style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: "1px solid var(--line-soft)", fontSize: 13 }}>
                    <span style={{ color: "var(--ink-soft)" }}>{label}</span><span style={{ fontFamily: "var(--font-mono)", fontWeight: 500 }}>{val}</span>
                  </div>))}
              </div></Panel>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function SettingsPage({ rules, setRules }) {
  const weightTotal = rules.reliability_weight_pct + rules.quality_weight_pct + rules.unit_price_weight_pct + rules.lead_time_weight_pct;
  const set = (key, val) => setRules({ ...rules, [key]: val });
  const NumberField = ({ label, helper, value, onChange, suffix }) => (
    <div style={{ marginBottom: 14 }}>
      <label style={{ fontSize: 12.5, color: "var(--ink-soft)", display: "block", marginBottom: 5 }}>{label}</label>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <input type="number" value={value} onChange={(e) => onChange(Number(e.target.value))} style={{ ...inputStyle, width: 110 }} />
        {suffix && <span style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>{suffix}</span>}
      </div>
      {helper && <span style={{ fontSize: 11.5, color: "var(--ink-faint)" }}>{helper}</span>}
    </div>
  );
  const WeightSlider = ({ label, value, onChange }) => (
    <div style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}><span>{label}</span><span style={{ fontFamily: "var(--font-mono)", fontWeight: 600 }}>{value}%</span></div>
      <input type="range" min="0" max="100" value={value} onChange={(e) => onChange(Number(e.target.value))} style={{ width: "100%", accentColor: "#0f7f82" }} />
    </div>
  );
  return (
    <div>
      <div style={{ marginBottom: 24 }}><h1 style={{ fontSize: 26, marginBottom: 6, fontFamily: "var(--font-display)" }}>Business Rules Configuration</h1>
        <p style={{ color: "var(--ink-soft)", fontSize: 14, maxWidth: 640, margin: 0 }}>Configure inventory thresholds, procurement buffers, supplier scoring weights and forecast settings. Changes apply immediately and are saved to this browser.</p></div>
      <div className="grid2">
        <div>
          <SectionHead title="Inventory rules" hint="Expiry windows, safety stock buffer" />
          <Panel style={{ padding: 18, marginBottom: 24 }}>
            <div className="twocol">
              <NumberField label="Near expiry threshold" helper="Batches expiring within this window are flagged." value={rules.near_expiry_threshold_days} onChange={(v) => set("near_expiry_threshold_days", v)} suffix="days" />
              <NumberField label="Critical expiry threshold" helper="Batches inside this window are escalated." value={rules.critical_expiry_threshold_days} onChange={(v) => set("critical_expiry_threshold_days", v)} suffix="days" />
              <NumberField label="Safety stock buffer" helper="Additional cover above expected consumption." value={rules.safety_stock_buffer_pct} onChange={(v) => set("safety_stock_buffer_pct", v)} suffix="%" />
              <NumberField label="Inventory health threshold" helper="Minimum health score considered acceptable." value={rules.inventory_health_threshold_pct} onChange={(v) => set("inventory_health_threshold_pct", v)} suffix="%" />
            </div>
          </Panel>
          <SectionHead title="Procurement rules" hint="Reorder buffers, default order sizing" />
          <Panel style={{ padding: 18 }}>
            <div className="twocol">
              <NumberField label="Reorder point buffer" helper="Uplift over the calculated reorder point." value={rules.reorder_point_buffer_pct} onChange={(v) => set("reorder_point_buffer_pct", v)} suffix="%" />
              <NumberField label="Emergency supplier lead time" helper="Assumed lead time from a backup supplier." value={rules.emergency_supplier_lead_time_days} onChange={(v) => set("emergency_supplier_lead_time_days", v)} suffix="days" />
              <NumberField label="Default procurement multiplier" helper="Order quantity as a multiple of safety stock." value={rules.default_procurement_qty_multiplier} onChange={(v) => set("default_procurement_qty_multiplier", v)} suffix="× safety stock" />
            </div>
          </Panel>
        </div>
        <div>
          <SectionHead title="Supplier scoring" />
          <Panel style={{ padding: 18 }}>
            <p style={{ fontSize: 12.5, color: "var(--ink-soft)", marginTop: 0 }}>Ranking weights used to compare qualified suppliers. Must total 100%.</p>
            <WeightSlider label="Reliability weight" value={rules.reliability_weight_pct} onChange={(v) => set("reliability_weight_pct", v)} />
            <WeightSlider label="Quality weight" value={rules.quality_weight_pct} onChange={(v) => set("quality_weight_pct", v)} />
            <WeightSlider label="Unit price weight" value={rules.unit_price_weight_pct} onChange={(v) => set("unit_price_weight_pct", v)} />
            <WeightSlider label="Lead time weight" value={rules.lead_time_weight_pct} onChange={(v) => set("lead_time_weight_pct", v)} />
            <div style={{ marginTop: 8, padding: "10px 16px", fontSize: 13, background: weightTotal === 100 ? "#e8f2ec" : "#f8e9e6", border: `1px solid ${weightTotal === 100 ? "#bfe0cf" : "#e6c2ba"}`, color: weightTotal === 100 ? "#265c40" : "#7a2c21" }}>
              {weightTotal === 100 ? "Weights are balanced." : `Weights total ${weightTotal}% — adjust to reach 100%.`}
            </div>
          </Panel>
        </div>
      </div>
    </div>
  );
}

const STORAGE_KEYS = { rules: "pidip_rules_v1", overrides: "pidip_inventory_overrides_v1", pos: "pidip_purchase_orders_v1" };

function loadStored(key, fallback) {
  try {
    const raw = window.localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function App() {
  const [active, setActive] = useState("dashboard");
  const [rules, setRules] = useState(() => loadStored(STORAGE_KEYS.rules, DEFAULT_RULES));
  const [inventoryOverrides, setInventoryOverrides] = useState(() => loadStored(STORAGE_KEYS.overrides, {}));
  const [purchaseOrders, setPurchaseOrders] = useState(() => loadStored(STORAGE_KEYS.pos, []));
  const [mobileOpen, setMobileOpen] = useState(false);
  const data = useComputed(rules, inventoryOverrides, purchaseOrders);

  React.useEffect(() => { window.localStorage.setItem(STORAGE_KEYS.rules, JSON.stringify(rules)); }, [rules]);
  React.useEffect(() => { window.localStorage.setItem(STORAGE_KEYS.overrides, JSON.stringify(inventoryOverrides)); }, [inventoryOverrides]);
  React.useEffect(() => { window.localStorage.setItem(STORAGE_KEYS.pos, JSON.stringify(purchaseOrders)); }, [purchaseOrders]);

  function saveInventoryOverride(id, values) {
    setInventoryOverrides((prev) => ({ ...prev, [id]: { ...(prev[id] || {}), ...values } }));
  }

  function createPurchaseOrder(rec) {
    const year = new Date().getFullYear();
    const poNumber = `PO-${year}-${String(purchaseOrders.length + 1).padStart(4, "0")}`;
    const expected = new Date(Date.now() + (rec.primarySupplier.leadTimeDays || 7) * DAY_MS).toISOString().slice(0, 10);
    const po = {
      poNumber, materialId: rec.materialId, materialName: rec.materialName,
      supplierName: rec.primarySupplier.name, quantity: rec.recommendedQty,
      leadTimeDays: rec.primarySupplier.leadTimeDays, expectedDate: expected, status: "Pending",
      createdAt: new Date().toISOString()
    };
    setPurchaseOrders((prev) => [po, ...prev]);
  }

  function setPOStatus(poNumber, status) {
    setPurchaseOrders((prev) => prev.map((po) => (po.poNumber === poNumber ? { ...po, status } : po)));
  }

  function resetDemoData() {
    if (!window.confirm("Reset all saved changes in this browser back to the original demo data?")) return;
    setRules(DEFAULT_RULES); setInventoryOverrides({}); setPurchaseOrders([]);
  }

  return (
    <div style={{ display: "flex", minHeight: "100vh" }}>
      <div className="sidebar-desktop"><Sidebar active={active} onChange={setActive} /></div>
      {mobileOpen && <div onClick={() => setMobileOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 15 }} />}
      <div className="sidebar-mobile" style={{ display: mobileOpen ? "block" : "none" }}><Sidebar active={active} onChange={setActive} mobileOpen={true} setMobileOpen={setMobileOpen} /></div>
      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 20px", borderBottom: "1px solid var(--line)", background: "#fff" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <button className="hamburger" onClick={() => setMobileOpen(true)} style={{ display: "none", border: "1px solid var(--line)", background: "#fff", borderRadius: 3, padding: "6px 9px", cursor: "pointer" }}>☰</button>
            <div style={{ fontSize: 13, color: "var(--ink-soft)" }}>Procurement &amp; Inventory Decision Intelligence Platform</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button onClick={resetDemoData} style={btnSecondary(false)}>Reset saved data</button>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, padding: "3px 8px", border: "1px solid var(--line)", borderRadius: 3, color: "var(--ink-soft)" }}>Installable app · saves to this device</div>
          </div>
        </div>
        <div style={{ padding: 32, maxWidth: 1240, width: "100%", margin: "0 auto" }}>
          {active === "dashboard" && <DashboardPage data={data} />}
          {active === "inventory" && <InventoryPage data={data} onSaveOverride={saveInventoryOverride} />}
          {active === "procurement" && <ProcurementPage data={data} purchaseOrders={purchaseOrders} onCreatePO={createPurchaseOrder} onSetPOStatus={setPOStatus} />}
          {active === "suppliers" && <SuppliersPage data={data} />}
          {active === "forecasting" && <ForecastingPage data={data} />}
          {active === "settings" && <SettingsPage rules={rules} setRules={setRules} />}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

  // Registers the service worker so the app is installable and works offline.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>

  .grid2{ display:grid; grid-template-columns:1.6fr 1fr; gap:20px; align-items:start; }

</body>
